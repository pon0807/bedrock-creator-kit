name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: 公開されるファイルの確認
        run: npm pack --dry-run
